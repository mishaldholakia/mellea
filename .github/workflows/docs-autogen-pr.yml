name: Auto-generate docs PR (PyPI mellea)

on:
  push:
    branches: ["feature/update-docs"]
  workflow_dispatch: {}
  schedule:
    - cron: "0 9 * * *" # daily 09:00 UTC (adjust as you like)

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: docs-autogen-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs_autogen:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (mdxify/griffe + latest mellea from PyPI)
        run: |
          python -m pip install --upgrade pip
          pip install -r tooling/docs-autogen/requirements.txt

      - name: Decide whether docs generation is needed
        id: decide
        shell: bash
        run: |
          set -euo pipefail

          DOCS_API_DIR="docs/docs/api"
          STAMP_FILE="$DOCS_API_DIR/.pypi-mellea-version"

          LATEST="$(python -c "import json, urllib.request; print(json.load(urllib.request.urlopen('https://pypi.org/pypi/mellea/json'))['info']['version'])")"
          echo "Latest PyPI mellea: $LATEST"

          CURRENT=""
          if [ -f "$STAMP_FILE" ]; then
            CURRENT="$(cat "$STAMP_FILE" | tr -d ' \n\r\t')"
          fi
          echo "Current stamped mellea: ${CURRENT:-<none>}"

          NEED="false"

          if [ ! -d "$DOCS_API_DIR" ]; then
            echo "docs/docs/api does not exist."
            NEED="true"
          else
            if ! find "$DOCS_API_DIR" -type f -name "*.mdx" | grep -q .; then
              echo "docs/docs/api exists but contains no .mdx."
              NEED="true"
            fi
          fi

          if [ "$CURRENT" != "$LATEST" ]; then
            echo "Version changed (or not stamped yet)."
            NEED="true"
          fi

          echo "need=$NEED" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"


      - name: Generate API docs + merge docs.json
        if: steps.decide.outputs.need == 'true'
        run: |
          set -euxo pipefail
          python3 tooling/docs-autogen/generate-ast.py \
            --docs-json docs/docs/docs.json \
            --docs-root docs/docs \
            --pypi-version "${{ steps.decide.outputs.latest }}"

      - name: Decorate API MDX (SidebarFix + pills)
        if: steps.decide.outputs.need == 'true'
        run: |
          set -euxo pipefail
          python3 tooling/docs-autogen/decorate_api_mdx.py \
            --docs-root docs/docs

      - name: Show git status
        if: steps.decide.outputs.need == 'true'
        run: |
          git status --porcelain
          git diff --stat || true

      - name: Create Pull Request
        if: steps.decide.outputs.need == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "docs: auto-generate (PyPI mellea ${{ steps.decide.outputs.latest }})"
          title: "docs: auto-generate (PyPI mellea ${{ steps.decide.outputs.latest }})"
          body: |
            This PR was automatically generated from the latest PyPI release of `mellea`.

            Trigger conditions:
            - docs/docs/api missing or empty, OR
            - PyPI version changed

            Latest PyPI version: ${{ steps.decide.outputs.latest }}
          branch: "automation/docs-autogen"
          delete-branch: true
          labels: |
            documentation
            automation
